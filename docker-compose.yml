services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aila}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aila}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aila}
      MIN_DELAY_SECONDS: ${MIN_DELAY_SECONDS:-3}
      MAX_DELAY_SECONDS: ${MAX_DELAY_SECONDS:-60}
      FAIL_RATE: ${FAIL_RATE:-0.2}
      CONCURRENCY: ${CONCURRENCY:-8}
      CLAIM_BATCH: ${CLAIM_BATCH:-10}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-300}
    depends_on:
      db:
        condition: service_healthy

  test-db:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: aila_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aila_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@test-db:5432/aila_test
    depends_on:
      test-db:
        condition: service_healthy
